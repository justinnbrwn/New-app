name: HashMargin private monitor tests
on:
  push:
    branches: [feature/hashmargin-pro-dashboard]
  pull_request:
    branches: [feature/hashmargin-pro-dashboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run offline tests
        run: |
          python -m compileall -q integrations private_monitor.py tests
          python -m unittest discover -s tests -v
