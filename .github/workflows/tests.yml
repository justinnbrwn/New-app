name: HashMargin checks
on:
  push:
    branches: [main, fix/hashmargin-startup]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest -v test_asic test_bridge test_fleet test_tenants test_upgrade
